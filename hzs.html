<title>HZS StreetLife</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: tablet uprostřed stránky, uvnitř stavový řádek s reflexním proužkem, boční navigace a pracovní plocha.
   Motiv: hasičská červená, reflexní žlutá, námořnická modrá. */
:root {
  --page: #dfe3ea; --bezel: #0d1117; --bezel-hi: #2b3340;
  --bg: #eceff3; --panel: #ffffff; --ink: #16202c; --mute: #5d6b7c; --line: #d5dbe3;
  --red: #c8102e; --btn: #c8102e; --btntxt: #ffffff; --amber: #f2a900;
  --side: #14213d; --sidetxt: #dfe5ee; --ok: #1f7a45; --warn: #a35f00; --bad: #c8102e;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: Barlow, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #090c11; --bg: #0e141c; --panel: #17202b; --ink: #e8edf3; --mute: #93a1b3; --line: #2a3646;
    --red: #ef4560; --btn: #d3203c; --side: #0a1018; --ok: #4cc17e; --warn: #e8a33a; --bad: #ef6b80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #090c11; --bg: #0e141c; --panel: #17202b; --ink: #e8edf3; --mute: #93a1b3; --line: #2a3646;
  --red: #ef4560; --btn: #d3203c; --side: #0a1018; --ok: #4cc17e; --warn: #e8a33a; --bad: #ef6b80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--ink); font: 16px/1.5 var(--font-body);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
p { margin: 0 0 8px; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* tablet */
.tablet {
  position: relative; max-width: 1120px; margin: 0 auto; padding: 20px 22px 14px;
  border-radius: 38px; background: linear-gradient(150deg, var(--bezel-hi), var(--bezel) 55%);
  box-shadow: 0 34px 60px -24px #0009, inset 0 0 0 2px #000, inset 0 0 0 4px #3a4350;
}
.cam { position: absolute; left: 50%; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #04060a; box-shadow: 0 0 0 2px #232b37; transform: translateX(-50%); }
.home { display: block; width: 130px; height: 4px; border-radius: 3px; background: #ffffff55; margin: 10px auto 0; }
.screen {
  position: relative; height: clamp(560px, calc(100vh - 110px), 800px); border-radius: 14px; overflow: hidden;
  background: var(--bg); display: grid; grid-template-rows: auto auto minmax(0, 1fr);
}
.statusbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 14px; background: #0b1220; color: #d4dcea; font-size: 13px; flex-wrap: wrap; }
.sbl, .sbr { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sbl b { font: 700 17px var(--font-display); letter-spacing: 0.04em; color: #fff; }
.logo { width: 20px; height: 20px; flex: none; }
.rb { background: var(--amber); color: #1a1a1a; font-weight: 700; padding: 0 8px; border-radius: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.stripe { height: 6px; background: repeating-linear-gradient(135deg, var(--red) 0 12px, var(--amber) 12px 24px); }
.body { min-height: 0; overflow: hidden; display: grid; }
.legal { text-align: center; color: var(--mute); font-size: 13px; margin: 14px auto 0; max-width: 720px; }

/* aplikace */
.app { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; }
aside { background: var(--side); color: var(--sidetxt); padding: 12px 10px; overflow: auto; }
nav a { display: block; padding: 8px 10px; border-radius: 6px; text-decoration: none; font-weight: 500; color: inherit; }
nav a:hover { background: #ffffff14; }
nav a.on { background: var(--btn); color: #fff; }
.ngroup { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9fb0c7; padding: 12px 10px 4px; }
.vas { margin-top: 14px; padding: 0 4px; font-size: 13px; color: #9fb0c7; }
main { overflow: auto; padding: 20px clamp(14px, 2.5vw, 28px) 28px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.top h2 { font-size: 36px; line-height: 1.1; }
.pill { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--ok); font-weight: 600; }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--red); border-radius: 6px; padding: 12px 14px; }
.stat b { display: block; font: 700 40px/1 var(--font-display); }
.stat span { color: var(--mute); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.card h3 { font-size: 22px; margin-bottom: 10px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 15px; vertical-align: middle; }
th { color: var(--mute); font-weight: 600; font-size: 13px; }
.tag { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 13px; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .mute { color: var(--mute); }
button { font: inherit; font-weight: 600; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; background: var(--btn); color: var(--btntxt); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.sec { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.sm { padding: 4px 10px; font-size: 14px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
form { display: grid; gap: 10px; }
label { font-size: 14px; font-weight: 600; display: grid; gap: 4px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border: 0; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.toolbar input, .toolbar select { max-width: 320px; }

/* chat */
.chat { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; }
.chans button { display: block; width: 100%; text-align: left; margin-bottom: 6px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
.chans button.on { background: var(--btn); color: #fff; border-color: var(--btn); }
.msgs { height: 340px; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 10px; }
.m { max-width: 82%; padding: 8px 12px; border-radius: 10px; background: var(--bg); overflow-wrap: anywhere; }
.m.me { align-self: flex-end; background: var(--btn); color: #fff; }
.m small { display: flex; gap: 8px; align-items: center; opacity: 0.8; font-size: 12px; }
.m small button { padding: 0 6px; font-size: 12px; background: transparent; color: inherit; border: 1px solid currentColor; }
.send { display: flex; gap: 8px; }

/* občané */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.ccard { display: flex; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.avatar { width: 52px; height: 52px; border-radius: 50%; flex: none; object-fit: cover; background: var(--side); color: #fff; display: grid; place-items: center; font: 700 20px var(--font-display); }
.ccard .t { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.thumb { position: relative; padding: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; overflow: hidden; text-align: left; color: var(--ink); display: block; width: 100%; }
.thumb img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.thumb span { display: block; padding: 6px 8px; font-size: 13px; overflow-wrap: anywhere; font-weight: 500; }
.preview { max-width: 100%; max-height: 220px; border-radius: 8px; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
details { padding: 8px 0; border-bottom: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 600; }

/* přihlášení */
.auth { display: grid; place-items: center; padding: 20px; overflow: auto; }
.authcard { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--red); border-radius: 10px; padding: 20px; display: grid; gap: 10px; }
.authcard h2 { font-size: 32px; }
.note { font-size: 13px; color: var(--mute); }
.linkbtn { background: none; color: var(--mute); border: 0; text-decoration: underline; padding: 0; font-weight: 500; }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 18px; width: min(480px, 92vw); max-height: 90vh; overflow: auto; }
dialog::backdrop { background: #000a; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: #0b1220; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: 90%; z-index: 5; }
.toast.on { opacity: 1; }

@media (max-width: 800px) {
  .tablet { padding: 8px; border-radius: 22px; }
  .cam, .home { display: none; }
  .screen { height: calc(100vh - 80px); min-height: 520px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  aside { padding: 6px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav a { white-space: nowrap; }
  .ngroup { display: none; }
  .vas { display: none; }
  .row, .chat { grid-template-columns: minmax(0, 1fr); }
  .top h2 { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="tablet">
  <span class="cam"></span>
  <div class="screen" id="scr">
    <header class="statusbar">
      <div class="sbl">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1c1.2 6 8 9 8 17a8 8 0 0 1-16 0c0-3.4 1.7-5.8 3.4-7.5.4 2.3 1.4 3.4 2.6 4C13 9.5 13.6 5 16 1z" fill="#f2a900"/><path d="M16 31a5 5 0 0 1-5-5c0-3 2.4-4.2 3.6-6.6.6 1.4 1.8 2.1 2.4 2.1 1.4 1.2 4 2.6 4 4.5a5 5 0 0 1-5 5z" fill="#e8334f"/></svg>
        <b>HZS StreetLife</b><span id="clock"></span>

    <div class="stripe"></div>

    <dialog id="dlg"></dialog>
  </div>
  <span class="home"></span>
</div>
<p class="legal">Herní roleplay projekt. Nejde o oficiální web Hasičského záchranného sboru České republiky. Nepoužívej tu heslo, které máš jinde.</p>

<script>
(function () {
  "use strict";
  var BASE_URL = "https://claude.ai/artifact/FRjjMtLXE8UuRugUCWqyXn";

  /* ---------- pomocné ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var ROLES = ["obcan", "hasic", "velitel", "vedeni"];
  var RN = { obcan: "Občan", hasic: "Hasič", velitel: "Velitel", vedeni: "Vedení" };
  function lvl(r) { return Math.max(0, ROLES.indexOf(r)); }
  var ST = { "Ve službě": "ok", "Mimo službu": "mute", "Pozastavený": "bad", "Čeká": "warn", "Schváleno": "ok", "Zamítnuto": "bad", "Probíhá": "warn", "Ukončeno": "mute", "Připraveno": "ok", "Ve výjezdu": "warn", "V opravě": "bad" };
  function tag(s) { return '<span class="tag ' + (ST[s] || "mute") + '">' + esc(s) + "</span>"; }
  function today() { return new Date().toLocaleDateString("sv-SE"); }
  function nowL() { return new Date().toLocaleString("sv-SE").slice(0, 16).replace(" ", "T"); }
  function fmtD(s) { return s ? new Date(String(s).length <= 10 ? s + "T00:00:00" : s).toLocaleDateString("cs-CZ") : ""; }
  function fmtDT(s) { return s ? new Date(s).toLocaleString("cs-CZ", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; }
  function fmtT(ts) { return new Date(ts).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }); }
  function sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function sset(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }

  /* ---------- stav ---------- */
  var S = { accounts: {}, members: {}, contacts: {}, invites: {}, invcodes: {}, claims: {}, roles: {}, resets: {},
    msgs: [], excuses: [], calls: [], fleet: [], courses: [], signups: [], docs: [], news: [], photos: [] };
  var db = null, user = null, myId = null, isOwner = false, isEd = false, canWrite = false;
  var phase = "boot", viewAs = null, authDoc = null, accDoc = null;
  var pendingImg = null, pendingPhoto = null;
  var chat = { hzs: "sbor", ob: "namesti" };
  var curRoom = null, unsubMsgs = null, photosSub = false, subsStarted = false;
  var fails = 0, lockUntil = 0;
  var loadedSet = {};
  var Q = { m: "", k: "", kt: "all" };
  var dirtySet = {}, flushT = null, lastSec = null;
  var BASE = ["accounts", "claims", "roles", "invites", "resets", "members", "contacts"];
  var tt = null;

  function toast(m) {
    var t = $("#toast"); t.textContent = m; t.classList.add("on");
    clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("on"); }, 4500);
  }
  async function W(p, msg) {
    try { await p; return true; }
    catch (e) { toast((msg || "Uložení se nepovedlo") + (e && e.code ? " (" + e.code + ")" : "")); return false; }
  }
  function onErr(e) { toast("Data se nepodařilo načíst" + (e && e.code ? " (" + e.code + ")" : "")); }

  /* ---------- heslo a pozvánky ---------- */
  var enc = new TextEncoder();
  function b64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  async function pbkdf(pw, salt, iter) {
    var k = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
    return b64(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: iter }, k, 256));
  }
  async function sha(s) {
    var d = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(s)));
    var o = ""; for (var i = 0; i < d.length; i++) o += d[i].toString(16).padStart(2, "0");
    return o;
  }
  function genCode() {
    var al = "abcdefghjkmnpqrstuvwxyz23456789", a = new Uint8Array(12), o = "";
    crypto.getRandomValues(a);
    for (var i = 0; i < a.length; i++) o += al[a[i] % al.length];
    return o;
  }
  function invCode() {
    var m = /^#pozvanka-([a-z0-9]+)$/i.exec(location.hash || "");
    return m ? m[1].toLowerCase() : "";
  }

  /* ---------- role ---------- */
  function firstClaim(h) {
    var best = null;
    for (var u in S.claims) {
      var c = S.claims[u];
      if (c.h !== h) continue;
      if (best === null || c.at < S.claims[best].at || (c.at === S.claims[best].at && u < best)) best = u;
    }
    return best;
  }
  function realRole(uid) {
    if (uid === myId && (isOwner || isEd)) return 3;
    if (S.roles[uid]) return lvl(S.roles[uid].role);
    var c = S.claims[uid];
    if (c) { var inv = S.invites[c.h]; if (inv && firstClaim(c.h) === uid) return lvl(inv.role); }
    return 0;
  }
  function myRole() { var r = realRole(myId); return viewAs == null ? r : Math.min(viewAs, r); }
  function can(n) { return myRole() >= n; }
  function isAdminLvl() { return isOwner || isEd; }
  function nick(u) { return (S.accounts[u] && S.accounts[u].nick) || "Neznámý"; }

  function hzsUids() { return Object.keys(S.accounts).filter(function (u) { return realRole(u) >= 1; }); }
  function defMember() {

  }
  var memberBusy = false;
  function ensureMember() {
    if (!canWrite || memberBusy || !S.accounts[myId]) return;
    if (realRole(myId) >= 1 && !S.members[myId]) {
      memberBusy = true;
      W(db.doc("members/" + myId).set(defMember())).then(function () { memberBusy = false; });
    }
    if ((isOwner || isEd) && !S.roles[myId] && !ensureMember.r) {

  }
  function initials(n) { return (String(n).trim()[0] || "?").toUpperCase(); }
  function av(u) {

  }

  /* ---------- obrázky ---------- */
  async function shrink(file, max, q) {

    var img = await new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = url; });
    var r = Math.min(1, max / Math.max(img.width, img.height));

    c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

    var qq = q, out = c.toDataURL("image/jpeg", qq);
    while (out.length > 180000 && qq > 0.3) { qq -= 0.1; out = c.toDataURL("image/jpeg", qq); }
    if (out.length > 180000) throw new Error("big");
    return out;
  }

  /* ---------- společné části zobrazení ---------- */
  function hd(t) { return '<div class="top"><h2>' + t + '</h2><span class="pill">Online</span></div>'; }
  function eb(c, id) { return can(2) ? '<button class="sm sec" data-act="edit" data-c="' + c + '" data-id="' + esc(id) + '">Upravit</button>' : ""; }
  function ab(c, l) { return can(2) ? '<p><button data-act="edit" data-c="' + c + '">' + l + "</button></p>" : ""; }
  function emptyRow(n, t) { return '<tr><td colspan="' + n + '" class="mute">' + t + "</td></tr>"; }

  var ROOMS = {
    hzs: [["sbor", "Celý sbor", 1], ["velitele", "Velitelé", 2], ["vedeni", "Vedení", 3]],
    ob: [["namesti", "Náměstí", 0], ["bazar", "Bazar a nabídky", 0], ["hlaseni", "Hlášení událostí", 0], ["prace", "Práce a brigády", 0]]
  };
  function activeRoom(g) {
    var rooms = ROOMS[g].filter(function (r) { return myRole() >= r[2]; });
    if (!rooms.some(function (r) { return r[0] === chat[g]; })) chat[g] = rooms[0][0];
    return { rooms: rooms, cur: chat[g], key: g + "-" + chat[g] };

  function chatView(g, title) {
    var a = activeRoom(g);
    var list = S.msgs.map(function (m) {

      return '<div class="m' + (mine ? " me" : "") + '"><small>' + esc(mine ? "Ty" : nick(m.uid)) + esc(badge) + " · " + fmtT(m.ts) + " " + del + "</small>" + esc(m.text) + "</div>";

    var a = ACT[b.dataset.act]; if (a) a(b, e);
  });
  document.addEventListener("submit", function (e) {
    var f = e.target.closest && e.target.closest("[data-form]"); if (!f) return;
    e.preventDefault();
    var h = FORM[f.dataset.form]; if (h) h(f);
  });
  document.addEventListener("input", function (e) {
    var t = e.target; if (t && t.dataset && t.dataset.live && LIVE[t.dataset.live]) LIVE[t.dataset.live](t);
  });
  document.addEventListener("change", function (e) {
    var t = e.target; if (t && t.dataset && t.dataset.change && CHG[t.dataset.change]) CHG[t.dataset.change](t);
  });
  window.addEventListener("hashchange", function () {
    if (phase !== "app") return;
    renderNav(); renderMain();
  });
  function tick() { var c = $("#clock"); if (c) c.textContent = new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }); }
  tick(); setInterval(tick, 30000);

  /* ---------- start ---------- */
  async function boot() {
    paintAuth();
    try {
      if (window.claude) { db = await window.claude.use("db"); user = await window.claude.use("user"); }
    } catch (e) {}
    if (!db || !user) { phase = "noapp"; return paintAuth(); }
    myId = await user.id();
    if (!myId) { phase = "noid"; return paintAuth(); }
    isOwner = await user.isOwner(); isEd = await user.canEdit();
    canWrite = (await user.can("data.write")) !== false;
    try {
      var a = await db.doc("accounts/" + myId).get();
      if (!a.exists) { phase = "register"; return paintAuth(); }
      accDoc = a.data();
      var au = await db.doc("data/users/" + myId + "/auth").get();
      if (!au.exists) { phase = "register"; return paintAuth(); }
      authDoc = au.data();
      var rs = await db.doc("resets/" + myId).get();
      if (rs.exists && rs.data().at > (authDoc.setAt || 0)) { phase = "reset"; return paintAuth(); }
    } catch (e) { onErr(e); phase = "noapp"; return paintAuth(); }
    if (sget("hzs-unlock") === myId) return enterApp();
    phase = "login"; paintAuth();
  }
  boot();
})();
</script>
