box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d2e;--panel:#14184a;--ink:#eceefb;--mute:#a3a8cf;--line:#2b3070;--err:#ff7b8c;--side:#07082b;--ok:#4cc17e;--warn:#e8a33a}}
:root[data-theme="dark"]{--bg:#0b0d2e;--panel:#14184a;--ink:#eceefb;--mute:#a3a8cf;--line:#2b3070;--err:#ff7b8c;--side:#07082b;--ok:#4cc17e;--warn:#e8a33a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:0;letter-spacing:.01em}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--side),#0b0d33);border-right:3px solid var(--red);color:var(--sidetxt);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px 16px;border-bottom:3px solid var(--red);margin-bottom:12px}.crest{width:78px;height:106px;background:var(--crest) center/contain no-repeat;margin-bottom:10px}
.brand h1{font-size:30px;color:#fff;line-height:1}.brand span{font-size:13px;color:#9fb0c7}
nav a{display:block;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;font-weight:500}
nav a:hover{background:#ffffff14}nav a.on{background:var(--red);color:var(--redtxt)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
.role{margin-top:18px;padding:0 8px;font-size:13px;color:#9fb0c7}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.role select{margin-top:4px}
main{padding:24px clamp(16px,3vw,36px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h2{font-size:38px;text-transform:uppercase;letter-spacing:.04em}.top h2::after{content:"";display:block;width:60px;height:4px;background:var(--red);margin-top:6px}.pill{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ok);font-weight:600}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:12px 14px}
.stat b{display:block;font:700 40px/1 "Barlow Condensed",sans-serif}.stat span{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card h3{font-size:22px;margin-bottom:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:13px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--err)}.mute{color:var(--mute)}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--red);color:var(--redtxt)}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}button.sm{padding:4px 10px;font-size:14px}
form{display:grid;gap:10px}label{font-size:14px;font-weight:600;display:grid;gap:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.chat{display:grid;grid-template-columns:200px 1fr;gap:14px}
.chans button{display:block;width:100%;text-align:left;margin-bottom:6px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.chans button.on{background:var(--red);color:var(--redtxt);border-color:var(--red)}
.msgs{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.m{max-width:80%;padding:8px 12px;border-radius:10px;background:var(--bg)}.m.me{align-self:flex-end;background:var(--red);color:var(--redtxt)}
.m small{display:block;opacity:.75;font-size:12px}
.send{display:flex;gap:8px}
.menu{display:none;margin-bottom:12px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.menu{display:none}.chat{grid-template-columns:1fr}.row{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:4px}}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:18px;width:min(460px,92vw)}dialog::backdrop{background:#0008}.acts{display:flex;gap:8px;flex-wrap:wrap}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.gal figure{margin:0}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}.gal figcaption{font-size:14px;color:var(--mute);padding-top:4px}body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:230px;background:var(--crest) center/min(78vh,560px) no-repeat;opacity:.12;pointer-events:none;z-index:0}.app{position:relative;z-index:1}@media(max-width:800px){body::before{left:0}}nav .grp{font:700 20px "Barlow Condensed",Arial,sans-serif;color:#fff;padding:4px 10px 6px;width:100%}
</style>
<style>artifact-sync,artifact-local{display:contents}</style></head>

d.innerHTML=`<form id="df"><h3>${i==null?"Přidat":"Upravit"} ${S.t}</h3>`+S.f.filter(a=>role>1||k!="members"||!["n","num","role","rank","h","ut"].includes(a[0])).map(([f,l,x,mt])=>mt=="multi"?`<fieldset style="border:1px solid var(--line);border-radius:6px;padding:8px 10px"><legend style="font-size:14px;font-weight:600">${l}</legend>${x.map(v=>`<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" name="${f}" value="${v}" style="width:auto"${(o[f]||"").split(", ").includes(v)?" checked":""}>${v}</label>`).join("")}<button type="button" class="sm sec" data-all="${f}" style="margin-top:6px">Vybrat všechny</button></fieldset>`:`<label>${l}`+(Array.isArray(x)?`<select name="${f}">${(x.includes(o[f])||!o[f]?x:[o[f],...x]).map(v=>`<option${v==o[f]?" selected":""}>${v}</option>`).join("")}</select>`:x=="area"?`<textarea name="${f}" rows="3">${esc(o[f])}</textarea>`:`<input name="${f}" type="${x||"text"}" value="${esc(o[f])}">`)+`</label>`).join("")+`<div class="acts"><button>Uložit</button><button type="button" class="sec" id="dc">Zrušit</button>${i!=null?`<button type="button" class="sec bad" id="dd">Smazat</button>`:""}</div></form>`;
const f=$("#df");d.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>b.parentElement.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=true));
f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),v=Object.fromEntries(fd);S.f.forEach(a=>{if(a[3]=="multi"&&f.elements[a[0]])v[a[0]]=fd.getAll(a[0]).join(", ")});if("h" in v)v.h=+v.h||0;if(i==null)DB[k].push({...S.blank,...v,...(k=="members"?{id:uid()}:{})});else Object.assign(o,v);d.close();render()};
$("#dc").onclick=()=>d.close();
const dd=$("#dd");if(dd)dd.onclick=()=>{if(dd.dataset.s){DB[k].splice(i,1);d.close();render()}else{dd.dataset.s=1;dd.textContent="Opravdu smazat?"}};
d.showModal()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-e]");if(!b)return;const[k,i]=b.dataset.e.split(":");edit(k,i=="new"?null:+i)});
function bindMembers(){const f=()=>{const q=($("#q").value||"").toLowerCase();$("#mb").innerHTML=members.filter(m=>(m.n+m.nick+m.rank).toLowerCase().includes(q)).map(m=>`<tr><td>${esc(m.n)}</td><td>${esc(m.nick||"")}</td><td>${esc(m.rank)}</td><td>${esc(m.role||"Hasič")}</td><td>${esc(m.ut||"–")}</td><td>${esc(m.num)}</td><td>${esc(m.since)}</td><td>${tag(m.st)}</td><td>${role>1?eb("members",members.indexOf(m)):""}</td></tr>`).join("")};$("#q").oninput=f;f()}

function publicView(){const h=(location.hash||"").slice(1),pg=["vyjezdy","kontakty","fotky"].includes(h)?h:"obcane";$("#rolebox").innerHTML="";$("#nav").innerHTML='<div class="grp">Občan</div>'+[["obcane","Přehled"],["kontakty","Kontakty"],["fotky","Fotky"],["vyjezdy","Výjezdy"]].map(([i,t])=>`<a href="#${i}" class="${i==pg?"on":""}">${t}</a>`).join("")+'<a href="#login" style="margin-top:14px">Přihlášení členů</a>';$("#main").innerHTML=V[pg]()}
function loginVed(){UID="vedeni";role=2;location.hash="#dashboard";try{localStorage.setItem("hzs2u",UID)}catch(e){}render()}
function login(m){UID=m.id;role=RL[m.role];location.hash="#dashboard";try{localStorage.setItem("hzs2u",UID)}catch(e){}render()}
function loginView(){$("#nav").innerHTML='<a href="#obcane">Občan</a><a href="#login" class="on">Přihlášení členů</a>';$("#rolebox").innerHTML="";
$("#main").innerHTML=hd("Přihlášení")+`<div class="grid"><div class="card"><h3>Člen sboru</h3><form id="lf"><label>Jméno<input id="lj" autocomplete="off" required></label><label>Příjmení<input id="lr" autocomplete="off" required></label><label>Osobní číslo<input id="lc" autocomplete="off" required></label><p class="bad" id="le"></p><button>Přihlásit se</button></form></div><div class="card"><h3>Vedení</h3><form id="vf"><label>Kód vedení<input id="vk" type="password" autocomplete="off" required></label><p class="bad" id="ve"></p><button>Přihlásit se jako Vedení</button></form></div></div>`;
$("#lf").onsubmit=e=>{e.preventDefault();const n=x=>$(x).value.trim().toLowerCase(),m=members.find(x=>x.n.toLowerCase()==n("#lj")+" "+n("#lr")&&(x.num||"").toLowerCase()==n("#lc"));if(m)login(m);else $("#le").textContent="Člen nenalezen. Zkontroluj jméno, příjmení a osobní číslo."};
$("#vf").onsubmit=e=>{e.preventDefault();if($("#vk").value.trim()==VEDKOD)loginVed();else $("#ve").textContent="Nesprávný kód."}}

function render(){delete chans["Celý sbor"];members.forEach(m=>{m.id=m.id||uid();m.role=m.role||"Hasič"});me=members.findIndex(m=>m.id==UID);const ved=UID=="vedeni";if(me<0&&!ved)return location.hash=="#login"?loginView():publicView();const U=ved?VED:members[me],mx=RL[U.role];role=Math.min(role,mx);
$("#rolebox").innerHTML=`<div style="margin-bottom:8px"><div>Přihlášen:</div><b style="font-size:17px;color:#fff">${esc(U.n)}</b>${ved?"":`<div>Osobní číslo: ${esc(U.num||"–")}</div>`}<div>${esc(U.rank||"")} · ${esc(U.role)}</div></div>`+(mx>0?`<label>Zobrazit jako<select id="role">${["Hasič","Velitel","Vedení"].slice(0,mx+1).map((r,i)=>`<option value="${i}"${i==role?" selected":""}>${r}</option>`).join("")}</select></label>`:"")+`<button class="sm sec" id="lo" style="margin-top:8px;color:#fff;border-color:#ffffff55">Odhlásit se</button>`+(mx>1&&ART?`<button class="sm" id="pubb" style="margin-top:8px;display:block">Zveřejnit změny${dsnap()!=BASE?" •":""}</button><div id="pubm" style="font-size:13px;margin-top:4px"></div>`:"");
const rs=$("#role");if(rs)rs.onchange=()=>{role=+rs.value;render()};const pb2=$("#pubb");if(pb2)pb2.onclick=pub;$("#lo").onclick=()=>{UID="";try{localStorage.removeItem("hzs2u")}catch(e){}render()};
const id=(location.hash||"#dashboard").slice(1);const ok=secs.filter(s=>s[2]<=role);const cur=ok.find(s=>s[0]==id)||ok[0];
$("#nav").innerHTML=ok.map(s=>`<a href="#${s[0]}" class="${s[0]==cur[0]?"on":""}">${s[1]}</a>`).join("");
if(ved)me=-1;save();$("#main").innerHTML=V[cur[0]]();const k=cur[0];
if(k=="fotky"){const pb=$("#phb");if(pb){pb.onclick=()=>$("#ph").click();$("#ph").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);photos.push({t:f.name.replace(/\.[^.]+$/,""),src:c.toDataURL("image/jpeg",.7)});render()};im.src=r.result};r.readAsDataURL(f)}}}
if(k=="clenove")bindMembers();
if(k=="messenger"){document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{chans[chan].splice(+b.dataset.dm,1);render()});document.querySelectorAll("[data-chan]").forEach(b=>b.onclick=()=>{chan=b.dataset.chan;render()});const send=()=>{const v=$("#msg").value.trim();if(!v)return;chans[chan].push([U.n,v,new Date().toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"})]);render();$("#msg").focus()};$("#sendb").onclick=send;$("#msg").onkeydown=e=>{if(e.key=="Enter")send()};const m=$("#msgs");m.scrollTop=m.scrollHeight}
if(k=="omluvenky"){$("#exf").onsubmit=e=>{e.preventDefault();const d=v=>v.split("-").reverse().slice(0,2).join(". ")+".";excuses.unshift({who:U.n,from:d($("#ef").value),to:d($("#et").value),why:$("#ew").value,s:"Čeká"});render()};document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{excuses[b.dataset.ex].s=b.dataset.v;render()})}
if(k=="sluzba"&&$("#duty"))$("#duty").onclick=()=>{if(ved){if(vsl.length)vsl.length=0;else vsl.push(1);return render()}const m=members[me];m.st=m.st=="Ve službě"?"Mimo službu":"Ve službě";render()};
if(k=="skoleni")document.querySelectorAll("[data-co]").forEach(b=>b.onclick=()=>{const c=courses[b.dataset.co];c.in=!c.in;render()});
if(k=="oznameni"&&role>1)$("#nf").onsubmit=e=>{e.preventDefault();news.unshift({t:$("#nt").value,b:$("#nb").value,d:"dnes"});render()}}

addEventListener("hashchange",render);render();
</script>
