<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HZS Praha – interní systém</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#16202c;--mute:#5d6b7c;--line:#d5dbe3;--red:#c8102e;--redtxt:#fff;--side:#14213d;--sidetxt:#dfe5ee;--ok:#1f7a45;--warn:#b26a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--panel:#17202b;--ink:#e8edf3;--mute:#93a1b3;--line:#2a3646;--red:#e8334f;--side:#0a1018;--ok:#4cc17e;--warn:#e8a33a}}
:root[data-theme="dark"]{--bg:#0e141c;--panel:#17202b;--ink:#e8edf3;--mute:#93a1b3;--line:#2a3646;--red:#e8334f;--side:#0a1018;--ok:#4cc17e;--warn:#e8a33a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:0;letter-spacing:.01em}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sidetxt);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px 16px;border-bottom:1px solid #ffffff22;margin-bottom:12px}
.brand h1{font-size:30px;color:#fff;line-height:1}.brand span{font-size:13px;color:#9fb0c7}
nav a{display:block;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;font-weight:500}
nav a:hover{background:#ffffff14}nav a.on{background:var(--red);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
.role{margin-top:18px;padding:0 8px;font-size:13px;color:#9fb0c7}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.role select{margin-top:4px}
main{padding:24px clamp(16px,3vw,36px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h2{font-size:38px}.pill{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ok);font-weight:600}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:12px 14px}
.stat b{display:block;font:700 40px/1 "Barlow Condensed",sans-serif}.stat span{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card h3{font-size:22px;margin-bottom:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:13px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--red)}.mute{color:var(--mute)}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--red);color:var(--redtxt)}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}button.sm{padding:4px 10px;font-size:14px}
form{display:grid;gap:10px}label{font-size:14px;font-weight:600;display:grid;gap:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.chat{display:grid;grid-template-columns:200px 1fr;gap:14px}
.chans button{display:block;width:100%;text-align:left;margin-bottom:6px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.chans button.on{background:var(--red);color:#fff;border-color:var(--red)}
.msgs{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.m{max-width:80%;padding:8px 12px;border-radius:10px;background:var(--bg)}.m.me{align-self:flex-end;background:var(--red);color:#fff}
.m small{display:block;opacity:.75;font-size:12px}
.send{display:flex;gap:8px}
.menu{display:none;margin-bottom:12px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.menu{display:none}.chat{grid-template-columns:1fr}.row{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:4px}}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:18px;width:min(460px,92vw)}dialog::backdrop{background:#0008}.acts{display:flex;gap:8px;flex-wrap:wrap}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.gal figure{margin:0}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}.gal figcaption{font-size:14px;color:var(--mute);padding-top:4px}nav .grp{font:700 20px "Barlow Condensed",Arial,sans-serif;color:#fff;padding:4px 10px 6px;width:100%}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand"><h1>HZS Praha</h1><span>Interní informační systém</span></div>
 <nav id="nav" aria-label="Hlavní navigace"></nav>
 <div class="role" id="rolebox"></div>
</aside>
<main id="main" tabindex="-1"></main>
<dialog id="dlg"></dialog>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let role=2,me=-1,UID="";try{UID=localStorage.getItem("hzs2u")||""}catch(e){}
const VEDKOD="150",VED={n:"Vedení",rank:"Plný přístup",role:"Vedení"},RL={"Hasič":0,"Velitel":1,"Vedení":2},uid=()=>Math.random().toString(36).slice(2,10);
const members=[
{n:"Jan Novák",nick:"Novy",rank:"Ředitel",pos:"Vedení",num:"001",since:"01. 01. 2026",st:"Ve službě",h:128},
{n:"Petr Svoboda",nick:"Svoboda",rank:"Náměstek ředitele",pos:"Vedení",num:"002",since:"05. 01. 2026",st:"Ve službě",h:112},
{n:"Tomáš Dvořák",nick:"Dvorak",rank:"Velitel stanice",pos:"Stanice Ostrava",num:"014",since:"20. 02. 2026",st:"Ve službě",h:96},
{n:"Martin Černý",nick:"Cerny",rank:"Hasič",pos:"Stanice Ostrava",num:"021",since:"11. 03. 2026",st:"Mimo službu",h:64},
{n:"Lukáš Procházka",nick:"Lukas",rank:"Hasič",pos:"Stanice Poruba",num:"027",since:"02. 04. 2026",st:"Mimo službu",h:51},
{n:"Jakub Kučera",nick:"Kuca",rank:"Strojník",pos:"Stanice Poruba",num:"030",since:"19. 04. 2026",st:"Ve službě",h:47},
{n:"David Veselý",nick:"Vesely",rank:"Hasič",pos:"Stanice Ostrava",num:"033",since:"30. 05. 2026",st:"Pozastavený",h:22}];
const excuses=[{who:"Martin Černý",from:"20. 11.",to:"23. 11.",why:"Pracovní povinnosti",s:"Čeká"},{who:"David Veselý",from:"18. 11.",to:"30. 11.",why:"Zkouškové období",s:"Schváleno"}];
const calls=[{id:"V-0412",type:"Požár bytu",unit:"Ostrava 1",alert:"19:42",out:"19:44",arr:"19:51",end:"",cmd:"Tomáš Dvořák",s:"Probíhá"},
{id:"V-0411",type:"Dopravní nehoda",unit:"Poruba 1",alert:"18:05",out:"18:07",arr:"18:13",end:"18:58",cmd:"Jakub Kučera",s:"Ukončeno"}];
const fleet=[{cs:"Ostrava 1",t:"CAS 20",rz:"1T2 4501",st:"Stanice Ostrava",s:"Ve výjezdu"},{cs:"Ostrava 2",t:"DA 12",rz:"1T2 4502",st:"Stanice Ostrava",s:"Připraveno"},{cs:"Poruba 1",t:"CAS 30",rz:"2T5 1130",st:"Stanice Poruba",s:"Připraveno"},{cs:"Poruba 2",t:"AZ 30",rz:"2T5 1131",st:"Stanice Poruba",s:"V opravě"}];
const courses=[{t:"Základní hasičský výcvik",d:"21. 11. 2026 18:00",in:true},{t:"Práce s dýchací technikou",d:"25. 11. 2026 19:00",in:false},{t:"Velení zásahu",d:"29. 11. 2026 18:30",in:false}];
const docs=["Organizační řád HZS","Pravidla služby","Hodnostní systém","Postupy při zásazích","Výcvikové materiály","Formulář: žádost o povýšení","Formulář: žádost o přeřazení"];
const news=[{t:"Porada vedení",b:"Sobota 21. 11. v 20:00 na stanici Ostrava. Účast velitelů povinná.",d:"18. 11."},{t:"Změny hodností",b:"Martin Černý byl povýšen na strojníka od 1. 12.",d:"16. 11."}];
const chans={"Celý sbor":[["Jan Novák","Zítra v 18:00 výcvik, dorazte včas."],["Jakub Kučera","Rozumím."]],"Vedení":[["Petr Svoboda","Schválil jsem dvě omluvenky."]],"Stanice Ostrava":[["Tomáš Dvořák","Ostrava 1 je zpět na stanici."]]};
let chan="Stanice Praha";
docs.forEach((d,i)=>{if(typeof d=="string")docs[i]={t:d}});
const info=[{t:"Tíseňové volání",b:"V případě požáru nebo nehody volejte linku 150 nebo 112. Zůstaňte klidní, řeknete, kde se nacházíte a co se stalo."},{t:"Prevence požárů",b:"Nenechávejte bez dozoru vařič, svíčky ani nabíječky. Mějte doma hasicí přístroj a funkční detektor kouře."},{t:"Co dělat při požáru",b:"Opusťte prostor, zavřete dveře za sebou, nepoužívejte výtah a vyčkejte příjezdu jednotky."}],photos=[],vyjezdy=[],kontakty=[{t:"Tísňová linka hasičů",b:"150"},{t:"Evropské číslo tísňového volání",b:"112"}];
const vsl=[];const onDuty=()=>[...(vsl.length?[{n:"Vedení",rank:"Plný přístup",pos:""}]:[]),...members.filter(m=>m.st=="Ve službě")];
const DB={members,excuses,fleet,courses,docs,news,info,photos,vyjezdy,kontakty,vsl};
function save(){try{localStorage.setItem("hzs2",JSON.stringify({...DB,chans}))}catch(e){}}
[members,excuses,fleet,courses,news].forEach(a=>a.length=0);for(const k in chans)delete chans[k];Object.assign(chans,{"Vedení":[],"Stanice Praha":[]});
try{const s=JSON.parse(localStorage.getItem("hzs2")||"null");if(s){for(const k in DB)if(s[k]){DB[k].length=0;DB[k].push(...s[k])}if(s.chans){for(const k in chans)delete chans[k];Object.assign(chans,s.chans)}}}catch(e){}
const secs=[["dashboard","Přehled",0],["obcane","Občan – přehled",0],["vyjezdy","Občan – výjezdy",0],["kontakty","Občan – kontakty",0],["fotky","Občan – fotky",0],["messenger","Messenger",0],["profil","Můj profil",0],["omluvenky","Omluvenky",0],["sluzba","Docházka",0],["clenove","Členové",0],["vozy","Vozový park",1],["skoleni","Školení",0],["dokumenty","Dokumenty",0],["oznameni","Oznámení",0]];
const stTag=s=>({"Ve službě":"ok","Mimo službu":"mute","Pozastavený":"bad","Čeká":"warn","Schváleno":"ok","Zamítnuto":"bad","Probíhá":"warn","Ukončeno":"mute","Připraveno":"ok","Ve výjezdu":"warn","V opravě":"bad"}[s]||"mute");
const tag=s=>`<span class="tag ${stTag(s)}">${esc(s)}</span>`;
const hd=t=>`<div class="top"><h2>${t}</h2><span class="pill">Online</span></div>`;
const V={
dashboard(){const on=members.filter(m=>m.st=="Ve službě").length+vsl.length,ex=excuses.filter(e=>e.s=="Schváleno").length;
return hd("Přehled sboru")+`<div class="stats"><div class="stat"><b>${members.length}</b><span>Členů</span></div><div class="stat"><b>${on}</b><span>Ve službě</span></div><div class="stat"><b>${ex}</b><span>Omluveno</span></div><div class="stat"><b>${fleet.length}</b><span>Vozidel</span></div></div>
<div class="grid">
<div class="card"><h3>Poslední oznámení</h3>${news.map(n=>`<div class="item"><b>${n.t}</b> <span class="mute">${n.d}</span><br>${n.b}</div>`).join("")}</div>
<div class="card"><h3>Nadcházející školení</h3>${courses.map(c=>`<div class="item"><b>${c.t}</b><br><span class="mute">${c.d}</span></div>`).join("")}</div></div>`},
messenger(){if(!visCh().includes(chan))chan=visCh()[0];return hd("Messenger")+`<div class="card chat"><div class="chans">${visCh().map(k=>`<button class="${k==chan?"on":""}" data-chan="${esc(k)}">${esc(k)}</button>`).join("")}</div><div><div class="msgs" id="msgs">${chans[chan].map((m,i)=>`<div class="m"><small>${esc(m[0])} ${can()?`<button class="sm sec" data-dm="${i}">Smazat</button>`:""}</small>${esc(m[1])}</div>`).join("")}</div><div class="send"><input id="msg" placeholder="Napište zprávu" aria-label="Zpráva"><button id="sendb">Odeslat</button></div></div></div>`},
profil(){const m=members[me];if(!m)return hd("Můj profil")+`<div class="card"><p>Přihlášen jako Vedení. Členy spravuješ v sekci Členové.</p></div>`;return hd("Můj profil")+`<div class="grid"><div class="card"><h3>${m.n}</h3><p><button class="sm sec" data-e="members:${me}">Upravit profil</button></p><p><b>Přezdívka:</b> ${m.nick}<br><b>Hodnost:</b> ${m.rank}<br><b>Zařazení:</b> ${m.pos}<br><b>Osobní číslo:</b> ${m.num}<br><b>Datum nástupu:</b> ${m.since}<br><b>Stav:</b> ${tag(m.st)}<br><b>Role v systému:</b> ${esc(m.role||"Hasič")}</p></div><div class="card"><h3>Odsloužené hodiny</h3><div class="stat"><b>${m.h}</b><span>hodin celkem</span></div></div><div class="card"><h3>Historie povýšení</h3><div class="item">${m.since} – nástup do sboru</div></div></div>`},
omluvenky(){return hd("Omluvenky")+`<div class="grid"><div class="card"><h3>Nová omluvenka</h3><form id="exf"><div class="row"><label>Od<input type="date" id="ef" required></label><label>Do<input type="date" id="et" required></label></div><label>Důvod nepřítomnosti<textarea id="ew" rows="3" required></textarea></label><button>Odeslat vedení</button></form></div>
<div class="card"><h3>Přehled omluvenek</h3><div class="tw"><table><tr><th>Člen</th><th>Termín</th><th>Důvod</th><th>Stav</th></tr>${excuses.map((e,i)=>`<tr><td>${esc(e.who)}</td><td>${esc(e.from)}–${esc(e.to)}</td><td>${esc(e.why)}</td><td>${tag(e.s)} ${eb("excuses",i)}${role>0&&e.s=="Čeká"?` <button class="sm" data-ex="${i}" data-v="Schváleno">Schválit</button> <button class="sm sec" data-ex="${i}" data-v="Zamítnuto">Zamítnout</button>`:""}</td></tr>`).join("")}</table></div></div></div>`},
sluzba(){const st=UID=="vedeni"?(vsl.length?"Ve službě":"Mimo službu"):members[me].st;return hd("Docházka a služby")+`<div class="card" style="margin-bottom:16px"><h3>Moje služba</h3><p>Stav: ${tag(st)}</p><button id="duty">${st=="Ve službě"?"Ukončit službu":"Nastoupit do služby"}</button></div><div class="card"><h3>Právě ve službě</h3>${onDuty().map(m=>`<div class="item"><b>${esc(m.n)}</b> · ${esc(m.rank)} <span class="mute">${m.pos?"("+esc(m.pos)+")":""}</span></div>`).join("")||"<p class='mute'>Nikdo.</p>"}</div>`},
clenove(){return hd("Evidence členů")+(role>1?ab("members","Přidat člena"):"")+`<div class="card"><input id="q" placeholder="Hledat podle jména, přezdívky nebo hodnosti" aria-label="Hledat člena" style="margin-bottom:10px"><div class="tw"><table><thead><tr><th>Jméno</th><th>Přezdívka</th><th>Hodnost</th><th>Zařazení</th><th>Č.</th><th>Nástup</th><th>Stav</th><th>Role</th><th></th></tr></thead><tbody id="mb"></tbody></table></div></div>`},
dispecink(){return hd("Dispečink")+`<div class="card"><div class="tw"><table><tr><th>Č.</th><th>Událost</th><th>Jednotka</th><th>Vyhlášeno</th><th>Výjezd</th><th>Příjezd</th><th>Ukončeno</th><th>Velitel</th><th>Stav</th></tr>${calls.map(c=>`<tr><td>${c.id}</td><td>${c.type}</td><td>${c.unit}</td><td>${c.alert}</td><td>${c.out}</td><td>${c.arr}</td><td>${c.end||"–"}</td><td>${c.cmd}</td><td>${tag(c.s)}</td></tr>`).join("")}</table></div></div>`},
vozy(){return hd("Vozový park")+ab("fleet","Přidat vozidlo")+`<div class="card"><div class="tw"><table><tr><th>Volací znak</th><th>Typ</th><th>RZ</th><th>Stanice</th><th>Stav</th><th></th></tr>${fleet.map((f,i)=>`<tr><td><b>${esc(f.cs)}</b></td><td>${esc(f.t)}</td><td>${esc(f.rz)}</td><td>${esc(f.st)}</td><td>${tag(f.s)}</td><td>${eb("fleet",i)}</td></tr>`).join("")}</table></div></div>`},
skoleni(){return hd("Školení a výcvik")+ab("courses","Přidat školení")+`<div class="card">${courses.map((c,i)=>`<div class="item" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>${c.t}</b><br><span class="mute">${c.d}</span></div><div style="display:flex;gap:6px"><button class="${c.in?"sec":""}" data-co="${i}">${c.in?"Odhlásit se":"Přihlásit se"}</button>${eb("courses",i)}</div></div>`).join("")}</div>`},
obcane(){const on=members.filter(m=>m.st=="Ve službě").length+vsl.length;
return hd("Hasičský záchranný sbor hl. m. Prahy")+`<div class="stats"><div class="stat"><b>${members.length}</b><span>Hasičů</span></div><div class="stat"><b>${on}</b><span>Ve službě</span></div><div class="stat"><b>${fleet.length}</b><span>Vozidel</span></div><div class="stat"><b>150</b><span>Tíseňová linka</span></div></div>
<div class="card" style="margin-bottom:16px"><h3>Informace pro občany</h3>${ab("info","Přidat informaci")}${info.map((n,i)=>`<div class="item"><b>${esc(n.t)}</b> ${eb("info",i)}<br>${esc(n.b)}</div>`).join("")||"<p class='mute'>Zatím žádné informace.</p>"}</div>
`},
vyjezdy(){return hd("Výjezdy")+`<div class="card"><h3>Výjezdy</h3>${ab("vyjezdy","Přidat výjezd")}${vyjezdy.map((n,i)=>`<div class="item"><b>${esc(n.t)}</b> <span class="mute">${esc(n.d)}</span> ${eb("vyjezdy",i)}<br>${esc(n.m)}${n.p?" – "+esc(n.p):""}</div>`).join("")||"<p class='mute'>Zatím žádné výjezdy.</p>"}</div>`},
kontakty(){return hd("Kontakty")+`<div class="card"><h3>Kontakty</h3>${ab("kontakty","Přidat kontakt")}${kontakty.map((n,i)=>`<div class="item"><b>${esc(n.t)}</b> ${eb("kontakty",i)}<br>${esc(n.b)}</div>`).join("")||"<p class='mute'>Zatím žádné kontakty.</p>"}</div>
`},
fotky(){return hd("Fotogalerie")+`<div class="card"><h3>Fotogalerie</h3>${can()?`<p><button id="phb">Přidat fotku</button><input type="file" id="ph" accept="image/*" hidden></p>`:""}<div class="gal">${photos.map((p,i)=>`<figure><img src="${esc(p.src)}" alt="${esc(p.t)}"><figcaption>${esc(p.t)} ${eb("photos",i)}</figcaption></figure>`).join("")||"<p class='mute'>Zatím žádné fotky.</p>"}</div></div>`},
dokumenty(){return hd("Dokumenty a předpisy")+ab("docs","Přidat dokument")+`<div class="card">${docs.map((d,i)=>`<div class="item" style="display:flex;justify-content:space-between;gap:10px">${esc(d.t)} ${eb("docs",i)}</div>`).join("")}</div>`},
oznameni(){return hd("Oznámení")+(role>1?`<div class="card" style="margin-bottom:16px"><h3>Nové oznámení</h3><form id="nf"><label>Nadpis<input id="nt" required></label><label>Text<textarea id="nb" rows="3" required></textarea></label><button>Zveřejnit</button></form></div>`:"")+`<div class="card">${news.map((n,i)=>`<div class="item"><b>${esc(n.t)}</b> <span class="mute">${esc(n.d)}</span> ${eb("news",i)}<br>${esc(n.b)}</div>`).join("")}</div>`}};
const can=()=>(me>=0||UID=="vedeni")&&role>=1;
const visCh=()=>Object.keys(chans).filter(k=>k!="Vedení"||role>=1);
const eb=(k,i)=>can()?`<button class="sm sec" data-e="${k}:${i}">Upravit</button>`:"";
const ab=(k,l)=>can()?`<p><button data-e="${k}:new">${l}</button></p>`:"";
const SCH={
members:{t:"člena",f:[["n","Jméno a příjmení"],["nick","Herní přezdívka"],["rank","Hodnost"],["pos","Zařazení"],["num","Osobní číslo"],["since","Datum nástupu"],["st","Stav",["Ve službě","Mimo službu","Pozastavený"]],["h","Odsloužené hodiny","number"],["role","Role v systému",["Hasič","Velitel"]]],blank:{n:"",nick:"",rank:"Hasič",pos:"",num:"",since:"",st:"Mimo službu",h:0,role:"Hasič"}},
excuses:{t:"omluvenku",f:[["who","Člen"],["from","Od"],["to","Do"],["why","Důvod","area"],["s","Stav",["Čeká","Schváleno","Zamítnuto"]]],blank:{who:"",from:"",to:"",why:"",s:"Čeká"}},
fleet:{t:"vozidlo",f:[["cs","Volací znak"],["t","Typ"],["rz","RZ"],["st","Stanice"],["s","Stav",["Připraveno","Ve výjezdu","V opravě"]]],blank:{cs:"",t:"",rz:"",st:"",s:"Připraveno"}},
courses:{t:"školení",f:[["t","Název"],["d","Termín"]],blank:{t:"",d:"",in:false}},
docs:{t:"dokument",f:[["t","Název"]],blank:{t:""}},
news:{t:"oznámení",f:[["t","Nadpis"],["d","Datum"],["b","Text","area"]],blank:{t:"",d:"dnes",b:""}},
info:{t:"informaci",f:[["t","Nadpis"],["b","Text","area"]],blank:{t:"",b:""}},
photos:{t:"fotku",f:[["t","Popisek"]],blank:{t:"",src:""}},
vyjezdy:{t:"výjezd",f:[["t","Událost"],["d","Datum a čas"],["m","Místo"],["p","Popis","area"]],blank:{t:"",d:"",m:"",p:""}},
kontakty:{t:"kontakt",f:[["t","Název"],["b","Kontakt","area"]],blank:{t:"",b:""}}};
function edit(k,i){const S=SCH[k],o=i==null?{...S.blank}:DB[k][i],d=$("#dlg");
d.innerHTML=`<form id="df"><h3>${i==null?"Přidat":"Upravit"} ${S.t}</h3>`+S.f.filter(a=>role>1||k!="members"||!["n","num","role"].includes(a[0])).map(([f,l,x])=>`<label>${l}`+(Array.isArray(x)?`<select name="${f}">${x.map(v=>`<option${v==o[f]?" selected":""}>${v}</option>`).join("")}</select>`:x=="area"?`<textarea name="${f}" rows="3">${esc(o[f])}</textarea>`:`<input name="${f}" type="${x||"text"}" value="${esc(o[f])}">`)+`</label>`).join("")+`<div class="acts"><button>Uložit</button><button type="button" class="sec" id="dc">Zrušit</button>${i!=null?`<button type="button" class="sec bad" id="dd">Smazat</button>`:""}</div></form>`;
const f=$("#df");
f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if("h" in v)v.h=+v.h||0;if(i==null)DB[k].push({...S.blank,...v,...(k=="members"?{id:uid()}:{})});else Object.assign(o,v);d.close();render()};
$("#dc").onclick=()=>d.close();
const dd=$("#dd");if(dd)dd.onclick=()=>{if(dd.dataset.s){DB[k].splice(i,1);d.close();render()}else{dd.dataset.s=1;dd.textContent="Opravdu smazat?"}};
d.showModal()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-e]");if(!b)return;const[k,i]=b.dataset.e.split(":");edit(k,i=="new"?null:+i)});
function bindMembers(){const f=()=>{const q=($("#q").value||"").toLowerCase();$("#mb").innerHTML=members.filter(m=>(m.n+m.nick+m.rank).toLowerCase().includes(q)).map(m=>`<tr><td>${m.n}</td><td>${m.nick}</td><td>${m.rank}</td><td>${m.pos}</td><td>${m.num}</td><td>${m.since}</td><td>${tag(m.st)}</td><td>${esc(m.role||"Hasič")}</td><td>${role>1?eb("members",members.indexOf(m)):""}</td></tr>`).join("")};$("#q").oninput=f;f()}

function publicView(){const h=(location.hash||"").slice(1),pg=["vyjezdy","kontakty","fotky"].includes(h)?h:"obcane";$("#rolebox").innerHTML="";$("#nav").innerHTML='<div class="grp">Občan</div>'+[["obcane","Přehled"],["kontakty","Kontakty"],["fotky","Fotky"],["vyjezdy","Výjezdy"]].map(([i,t])=>`<a href="#${i}" class="${i==pg?"on":""}">${t}</a>`).join("")+'<a href="#login" style="margin-top:14px">Přihlášení členů</a>';$("#main").innerHTML=V[pg]()}
function loginVed(){UID="vedeni";role=2;location.hash="#dashboard";try{localStorage.setItem("hzs2u",UID)}catch(e){}render()}
function login(m){UID=m.id;role=RL[m.role];location.hash="#dashboard";try{localStorage.setItem("hzs2u",UID)}catch(e){}render()}
function loginView(){$("#nav").innerHTML='<a href="#obcane">Občan</a><a href="#login" class="on">Přihlášení členů</a>';$("#rolebox").innerHTML="";
$("#main").innerHTML=hd("Přihlášení")+`<div class="grid"><div class="card"><h3>Člen sboru</h3><form id="lf"><label>Jméno<input id="lj" autocomplete="off" required></label><label>Příjmení<input id="lr" autocomplete="off" required></label><label>Osobní číslo<input id="lc" autocomplete="off" required></label><p class="bad" id="le"></p><button>Přihlásit se</button></form></div><div class="card"><h3>Vedení</h3><form id="vf"><label>Kód vedení<input id="vk" type="password" autocomplete="off" required></label><p class="bad" id="ve"></p><button>Přihlásit se jako Vedení</button></form></div></div>`;
$("#lf").onsubmit=e=>{e.preventDefault();const n=x=>$(x).value.trim().toLowerCase(),m=members.find(x=>x.n.toLowerCase()==n("#lj")+" "+n("#lr")&&(x.num||"").toLowerCase()==n("#lc"));if(m)login(m);else $("#le").textContent="Člen nenalezen. Zkontroluj jméno, příjmení a osobní číslo."};
$("#vf").onsubmit=e=>{e.preventDefault();if($("#vk").value.trim()==VEDKOD)loginVed();else $("#ve").textContent="Nesprávný kód."}}

function render(){delete chans["Celý sbor"];members.forEach(m=>{m.id=m.id||uid();m.role=m.role=="Vedení"?"Velitel":(m.role||"Hasič")});me=members.findIndex(m=>m.id==UID);const ved=UID=="vedeni";if(me<0&&!ved)return location.hash=="#login"?loginView():publicView();const U=ved?VED:members[me],mx=RL[U.role];role=Math.min(role,mx);
$("#rolebox").innerHTML=`<div style="margin-bottom:8px"><div>Přihlášen:</div><b style="font-size:17px;color:#fff">${esc(U.n)}</b>${ved?"":`<div>Osobní číslo: ${esc(U.num||"–")}</div>`}<div>${esc(U.rank||"")} · ${esc(U.role)}</div></div>`+(mx>0?`<label>Zobrazit jako<select id="role">${["Hasič","Velitel","Vedení"].slice(0,mx+1).map((r,i)=>`<option value="${i}"${i==role?" selected":""}>${r}</option>`).join("")}</select></label>`:"")+`<button class="sm sec" id="lo" style="margin-top:8px;color:#fff;border-color:#ffffff55">Odhlásit se</button>`;
const rs=$("#role");if(rs)rs.onchange=()=>{role=+rs.value;render()};$("#lo").onclick=()=>{UID="";try{localStorage.removeItem("hzs2u")}catch(e){}render()};
const id=(location.hash||"#dashboard").slice(1);const ok=secs.filter(s=>s[2]<=role);const cur=ok.find(s=>s[0]==id)||ok[0];
$("#nav").innerHTML=ok.map(s=>`<a href="#${s[0]}" class="${s[0]==cur[0]?"on":""}">${s[1]}</a>`).join("");
if(ved)me=-1;save();$("#main").innerHTML=V[cur[0]]();const k=cur[0];
if(k=="fotky"){const pb=$("#phb");if(pb){pb.onclick=()=>$("#ph").click();$("#ph").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);photos.push({t:f.name.replace(/\.[^.]+$/,""),src:c.toDataURL("image/jpeg",.7)});render()};im.src=r.result};r.readAsDataURL(f)}}}
if(k=="clenove")bindMembers();
if(k=="messenger"){document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{chans[chan].splice(+b.dataset.dm,1);render()});document.querySelectorAll("[data-chan]").forEach(b=>b.onclick=()=>{chan=b.dataset.chan;render()});const send=()=>{const v=$("#msg").value.trim();if(!v)return;chans[chan].push([U.n,v]);render();$("#msg").focus()};$("#sendb").onclick=send;$("#msg").onkeydown=e=>{if(e.key=="Enter")send()};const m=$("#msgs");m.scrollTop=m.scrollHeight}
if(k=="omluvenky"){$("#exf").onsubmit=e=>{e.preventDefault();const d=v=>v.split("-").reverse().slice(0,2).join(". ")+".";excuses.unshift({who:U.n,from:d($("#ef").value),to:d($("#et").value),why:$("#ew").value,s:"Čeká"});render()};document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{excuses[b.dataset.ex].s=b.dataset.v;render()})}
if(k=="sluzba"&&$("#duty"))$("#duty").onclick=()=>{if(ved){if(vsl.length)vsl.length=0;else vsl.push(1);return render()}const m=members[me];m.st=m.st=="Ve službě"?"Mimo službu":"Ve službě";render()};
if(k=="skoleni")document.querySelectorAll("[data-co]").forEach(b=>b.onclick=()=>{const c=courses[b.dataset.co];c.in=!c.in;render()});
if(k=="oznameni"&&role>1)$("#nf").onsubmit=e=>{e.preventDefault();news.unshift({t:$("#nt").value,b:$("#nb").value,d:"dnes"});render()}}

addEventListener("hashchange",render);render();
</script>
</body>
</html>
